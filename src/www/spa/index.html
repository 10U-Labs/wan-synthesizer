<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WAN Graph Synthesizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="sign-in">
      <div id="sign-in-card">
        <svg id="sign-in-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 14 L36 14 L36 34 L12 34 Z M12 14 L36 34 M36 14 L12 34" />
          <circle cx="12" cy="14" r="4" /><circle cx="36" cy="14" r="4" />
          <circle cx="36" cy="34" r="4" /><circle cx="12" cy="34" r="4" />
        </svg>
        <h1>WAN Graph Synthesizer</h1>
        <p id="sign-in-note"></p>
        <div id="google-button"></div>
        <p id="sign-in-footer">10U Labs</p>
      </div>
    </div>
    <div id="app" hidden>
      <header id="bar">
        <strong>WAN Graph Synthesizer</strong>
        <nav id="tenants" aria-label="Tenant view"></nav>
        <span id="counts" aria-live="polite"></span>
      </header>
      <div id="map"></div>
    </div>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="vendor/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
