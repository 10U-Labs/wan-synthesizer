---
concurrency:
  cancel-in-progress: true
  group: documentation-${{ github.ref }}
jobs:
  assert-no-pytest-plugin-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-pytest-plugin-declarations
      - name: Assert no pytest plugin declarations
        run: >-
          assert-no-pytest-plugin-declarations
          --verbose
          ${{ github.workspace }}/test/documentation
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/documentation
  assert-pytest-class-holds-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-pytest-class-holds-state
      - name: Assert every pytest class holds state
        run: >-
          assert-pytest-class-holds-state
          --verbose
          ${{ github.workspace }}/test/documentation
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-pytest-fixture-name-is-needed
      - name: Assert every pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          ${{ github.workspace }}/test/documentation
  assert-pytest-test-can-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-pytest-test-can-fail
      - name: Assert every pytest test can fail
        run: >-
          assert-pytest-test-can-fail
          --verbose
          ${{ github.workspace }}/test/documentation
  code-scanning:
    permissions:
      contents: read
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Hold the repository to code scanning with the extended suite
        run: >-
          PYTHONPATH=.:lib/python
          python3 -m pytest
          test/documentation/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/documentation.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: |
          npm install -g markdownlint-cli
          pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files
      - name: Assert no inline markdownlint disables
        run: >-
          assert-no-inline-directives
          --tools markdownlint
          --verbose
          ${{ github.workspace }}/**/*
      - name: Assert no markdownlint config files
        run: >-
          assert-no-linter-config-files
          --linters markdownlint
          --verbose
          ${{ github.workspace }}
      - name: Lint Markdown
        run: markdownlint '**/*.md' '.claude/**/*.md' --disable MD013
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pytest pyyaml types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python
          python3 -m mypy --strict --explicit-package-bases
          --ignore-missing-imports
          test/documentation/
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint pytest pyyaml
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python
          python3 -m pylint --recursive=y
          test/documentation/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/documentation.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: >-
          pip install
          assert-no-inline-directives
          assert-no-linter-config-files
          yamllint
      - name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/documentation.yml
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/documentation.yml
name: documentation
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - .claude/**/*.md
      - .github/workflows/documentation.yml
      - test/documentation/**
  workflow_dispatch: {}
permissions:
  contents: read
