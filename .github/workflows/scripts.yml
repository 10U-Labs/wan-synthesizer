---
concurrency:
  cancel-in-progress: true
  group: scripts
jobs:
  assert-every-dataclass-field-is-read:
    name: assert-every-dataclass-field-is-read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-every-dataclass-field-is-read
      - name: Assert every dataclass field the repository declares is read
        run: >-
          assert-every-dataclass-field-is-read
          --verbose
          src
          lib/python
  assert-no-comments:
    name: assert-no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-comments
      - name: Assert nothing this repository publishes carries a comment
        run: >-
          assert-no-comments
          --annotate
          --exclude 'src/www/spa/vendor/*'
          --verbose
          .github/workflows
          lib
          src
          test
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/lib/python
          ${{ github.workspace }}/test/lib/python
  assert-no-linter-config-files:
    name: assert-no-linter-config-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-pytest-plugin-declarations:
    name: assert-no-pytest-plugin-declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-pytest-plugin-declarations
      - name: Assert no pytest plugin declarations
        run: >-
          assert-no-pytest-plugin-declarations
          --verbose
          ${{ github.workspace }}/test/lib/python
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/lib/python
  assert-pytest-class-holds-state:
    name: assert-pytest-class-holds-state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-pytest-class-holds-state
      - name: Assert every pytest class holds state
        run: >-
          assert-pytest-class-holds-state
          --verbose
          ${{ github.workspace }}/test/lib/python
  assert-pytest-fixture-is-requested:
    name: assert-pytest-fixture-is-requested
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Install tools
        run: >-
          pip install assert-pytest-fixture-is-requested boto3 boto3-stubs
          pytest 'python-hcl2<8' pyyaml
      - name: Assert every pytest fixture is requested
        run: >-
          PYTHONPATH=.:lib/python:src:test
          assert-pytest-fixture-is-requested
          --defined-in lib/python
          --dont-search-in 'test/lib/python/test_{package}'
          --pytest-argument=--confcutdir=test
          --pytest-argument=--import-mode=importlib
          --verbose
          test/
          lib/
  assert-pytest-fixture-name-is-needed:
    name: assert-pytest-fixture-name-is-needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-pytest-fixture-name-is-needed
      - name: Assert every pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          ${{ github.workspace }}/test/lib/python
  assert-pytest-test-can-fail:
    name: assert-pytest-test-can-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-pytest-test-can-fail
      - name: Assert every pytest test can fail
        run: >-
          assert-pytest-test-can-fail
          --verbose
          ${{ github.workspace }}/test/lib/python
  assert-python-definition-is-used:
    name: assert-python-definition-is-used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every definition is named somewhere else
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          search-in: lib/python src test
          trees: lib/python
          verbose: "true"
  assert-python-definition-is-used-outside-own-tests:
    name: assert-python-definition-is-used-outside-own-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every definition is named outside its own package's tests
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          dont-search-in: test/lib/python/{package}
          search-in: lib/python src test
          trees: lib/python
          verbose: "true"
  copy-paste-source:
    name: copy-paste-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          lib/python/
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          test/lib/python/
  mypy-source:
    name: mypy-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases lib/python/
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:test
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases test/lib/python/
  pylint-source:
    name: pylint-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python
          python3 -m pylint --recursive=y
          lib/python/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:test
          python3 -m pylint --recursive=y
          test/lib/python/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  test-lib-loader:
    name: test-lib-loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --upgrade pytest pytest-cov
      - name: Run the loader's unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:src:test
          python3 -m pytest
          test/lib/python/loader/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/loader
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  test-lib-repo-utils:
    name: test-lib-repo-utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --upgrade boto3 pytest pytest-cov 'python-hcl2<8' pyyaml
      - name: Run unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:src:test
          python3 -m pytest
          test/lib/python/repo_utils/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/repo_utils
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install yamllint
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/scripts.yml
name: scripts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/scripts.yml
      - lib/python/**
      - src/**
      - test/**
  workflow_dispatch:
permissions:
  contents: read
