---
concurrency:
  cancel-in-progress: true
  group: scripts
jobs:
  assert-every-dataclass-field-is-read:
    name: assert-every-dataclass-field-is-read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every dataclass field the repository declares is read
        uses: 10U-Labs/assert-every-dataclass-field-is-read@latest
        with:
          trees: src lib/python
          verbose: "true"
  assert-no-comments:
    name: assert-no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert nothing this repository publishes carries a comment
        uses: 10U-Labs/assert-no-comments@latest
        with:
          annotate: "true"
          exclude: src/www/spa/vendor/*
          trees: .github/workflows lib src test
          verbose: "true"
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no inline directives
        uses: 10U-Labs/assert-no-inline-directives@latest
        with:
          files: .github/workflows/scripts.yml lib/python test/lib/python
          tools: pylint,mypy,yamllint
          verbose: "true"
  assert-no-linter-config-files:
    name: assert-no-linter-config-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no linter config files
        uses: 10U-Labs/assert-no-linter-config-files@latest
        with:
          directories: .
          linters: pylint,mypy,yamllint
          verbose: "true"
  assert-no-pytest-plugin-declarations:
    name: assert-no-pytest-plugin-declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no pytest plugin declarations
        uses: 10U-Labs/assert-no-pytest-plugin-declarations@latest
        with:
          trees: test/lib/python
          verbose: "true"
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert one assert per pytest
        uses: 10U-Labs/assert-one-assert-per-pytest@latest
        with:
          files: test/lib/python
          verbose: "true"
  assert-pytest-class-holds-state:
    name: assert-pytest-class-holds-state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest class holds state
        uses: 10U-Labs/assert-pytest-class-holds-state@latest
        with:
          files: test/lib/python
          verbose: "true"
  assert-pytest-fixture-is-requested:
    name: assert-pytest-fixture-is-requested
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Install what the collection imports
        run: pip install boto3 boto3-stubs pytest 'python-hcl2<8' pyyaml
      - env:
          PYTHONPATH: .:lib/python:src:test
        name: Assert every pytest fixture is requested
        uses: 10U-Labs/assert-pytest-fixture-is-requested@latest
        with:
          defined-in: lib/python
          dont-search-in: test/lib/python/test_{package}
          import-mode: importlib
          pytest-arguments: --confcutdir=test
          trees: test/ lib/
          verbose: "true"
  assert-pytest-fixture-name-is-needed:
    name: assert-pytest-fixture-name-is-needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest fixture name is needed
        uses: 10U-Labs/assert-pytest-fixture-name-is-needed@latest
        with:
          trees: test/lib/python
          verbose: "true"
  assert-pytest-test-can-fail:
    name: assert-pytest-test-can-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest test can fail
        uses: 10U-Labs/assert-pytest-test-can-fail@latest
        with:
          files: test/lib/python
          verbose: "true"
  assert-python-definition-is-used:
    name: assert-python-definition-is-used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every definition is named somewhere else
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          search-in: lib/python src test
          trees: lib/python
          verbose: "true"
  assert-python-definition-is-used-outside-own-tests:
    name: assert-python-definition-is-used-outside-own-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every definition is named outside its own package's tests
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          dont-search-in: test/lib/python/{package}
          search-in: lib/python src test
          trees: lib/python
          verbose: "true"
  copy-paste-source:
    name: copy-paste-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          src/ lib/
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          test/ lib/
  mypy-source:
    name: mypy-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pyyaml types-PyYAML
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python:src
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases src/ lib/
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:src
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases test/ lib/
  pylint-source:
    name: pylint-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint pyyaml
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python:src
          python3 -m pylint --recursive=y
          src/ lib/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint pytest pyyaml 'python-hcl2<8' boto3
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:src
          python3 -m pylint --recursive=y
          test/ lib/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  test-lib-loader:
    name: test-lib-loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --upgrade pytest pytest-cov
      - name: Run the loader's unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:src:test
          python3 -m pytest
          test/lib/python/loader/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/loader
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  test-lib-repo-utils:
    name: test-lib-repo-utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --upgrade pytest pytest-cov
      - name: Run unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:src:test
          python3 -m pytest
          test/lib/python/repo_utils/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/repo_utils
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: >-
            {extends: default, rules: {
            empty-lines: {max: 0, max-start: 0, max-end: 1},
            key-ordering: enable,
            line-length: disable,
            new-line-at-end-of-file: enable,
            truthy: {allowed-values: ["true", "false", "on"]}}}
          file_or_dir: .github/workflows/scripts.yml
          strict: "true"
name: scripts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/scripts.yml
      - lib/python/**
      - src/**
      - test/**
  workflow_dispatch:
permissions:
  contents: read
