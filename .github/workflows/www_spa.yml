---
concurrency:
  cancel-in-progress: true
  group: www-spa
jobs:
  assert-no-comments:
    name: assert-no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-comments
      - name: Assert nothing this repository publishes carries a comment
        run: >-
          assert-no-comments
          --annotate
          --exclude 'src/www/spa/vendor/*'
          --verbose
          .github/workflows
          etc
          lib
          scripts
          src
          test
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/test/www/spa
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/www/spa
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console test/www/spa/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-one-assert-per-pytest
      - copy-paste-tests
      - mypy-tests
      - pylint-tests
      - unit-tests
      - yamllint
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Sync the site to 10ulabs.com/wan-synthesizer/
        run: |
          aws s3 sync src/www/spa/ s3://www-10ulabs-com/wan-synthesizer/ \
            --delete --exclude "api/*"
      - name: Invalidate the website CloudFront path
        run: |
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, \
              '10ulabs.com')].Id | [0]" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST" \
            --paths "/wan-synthesizer/*"
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:scripts
          python3 -m mypy --strict --explicit-package-bases
          --ignore-missing-imports
          test/www/spa/
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint pytest pyyaml 'python-hcl2<8'
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:scripts
          python3 -m pylint --recursive=y
          test/www/spa/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml 'python-hcl2<8'
      - name: Run unit tests
        run: >-
          PYTHONPATH=.:lib/python:scripts
          python3 -m pytest
          test/www/spa/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/www_spa.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: >-
          pip install
          assert-no-inline-directives
          assert-no-linter-config-files
          yamllint
      - name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/www_spa.yml
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_spa.yml
name: www_spa
'on':
  push:
    branches: [main]
    paths:
      - src/www/spa/**
      - test/www/spa/**
      - .github/workflows/www_spa.yml
  workflow_dispatch: {}
