---
concurrency:
  cancel-in-progress: true
  group: seed
jobs:
  assert-no-comments:
    name: assert-no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-comments
      - name: Assert nothing this repository publishes carries a comment
        run: >-
          assert-no-comments
          --annotate
          --exclude 'src/www/spa/vendor/*'
          --verbose
          .github/workflows
          etc
          lib
          scripts
          src
          test
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/lib/python ${{ github.workspace }}/scripts ${{ github.workspace }}/test/scripts
          ${{ github.workspace }}/test/lib/python/repo_utils
          ${{ github.workspace }}/test/lib/python/test_http_doubles
  assert-no-linter-config-files:
    name: assert-no-linter-config-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/scripts/seed
          ${{ github.workspace }}/test/lib/python/repo_utils
          ${{ github.workspace }}/test/lib/python/test_http_doubles
  assert-python-definition-is-used:
    name: assert-python-definition-is-used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every definition is named outside the tests
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          search-in: lib/python scripts src
          trees: scripts
          verbose: "true"
  copy-paste-source:
    name: copy-paste-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0 --reporters console
          scripts/seed.py lib/python/
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console test/scripts/seed/
          test/lib/python/repo_utils
          test/lib/python/test_http_doubles
  e2e-tests:
    if: ${{ !cancelled() && needs.wait-for-every-wan.result == 'success' }}
    name: e2e-tests
    needs:
      - wait-for-every-wan
      - test-repo-libraries
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.SEED_ROLE_ARN }}
      - name: Read the API key the authorizer admits
        run: |
          KEY=$(aws ssm get-parameter --name /wan-synthesizer/api-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          echo "WAN_SYNTHESIZER_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Install tools
        run: pip install pytest pyyaml
      - name: Check every published network against the config that asked for it
        run: >-
          PYTHONPATH=.:lib/python:scripts:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/scripts/seed/post_deployment/e2e/
          --import-mode=importlib --confcutdir=test
          --verbose
  integration-tests:
    name: integration-tests
    needs: test-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pyyaml 'python-hcl2<8'
      - name: Run integration tests against a mocked and a stubbed API
        run: >-
          PYTHONPATH=.:lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/scripts/seed/pre_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  mypy-source:
    name: mypy-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python:scripts
          python3 -m mypy --strict --ignore-missing-imports
          --explicit-package-bases scripts/seed.py lib/python/
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m mypy --strict
          --explicit-package-bases test/scripts/seed/
          test/lib/python/repo_utils
          test/lib/python/test_http_doubles
  pylint-source:
    name: pylint-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python:scripts:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pylint
          scripts/seed.py lib/python/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 boto3-stubs botocore-stubs pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:scripts:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pylint --recursive=y
          test/scripts/seed/
          test/lib/python/repo_utils
          test/lib/python/test_http_doubles
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  seeding:
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.assert-no-comments.result == 'success'
      && needs.assert-no-inline-directives.result == 'success'
      && needs.assert-no-linter-config-files.result == 'success'
      && needs.assert-one-assert-per-pytest.result == 'success'
      && needs.assert-python-definition-is-used.result == 'success'
      && needs.copy-paste-source.result == 'success'
      && needs.copy-paste-tests.result == 'success'
      && needs.integration-tests.result == 'success'
      && needs.mypy-source.result == 'success'
      && needs.mypy-tests.result == 'success'
      && needs.pylint-source.result == 'success'
      && needs.pylint-tests.result == 'success'
      && needs.test-repo-libraries.result == 'success'
      && needs.unit-tests.result == 'success'
      && needs.wait-for-every-deploy.result == 'success'
      && needs.wait-for-every-deploy.outputs.apply == 'true'
      && needs.yamllint.result == 'success' }}
    name: seeding
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-one-assert-per-pytest
      - assert-python-definition-is-used
      - copy-paste-source
      - copy-paste-tests
      - integration-tests
      - mypy-source
      - mypy-tests
      - pylint-source
      - pylint-tests
      - test-repo-libraries
      - unit-tests
      - wait-for-every-deploy
      - yamllint
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.SEED_ROLE_ARN }}
      - name: Read the API key the authorizer admits
        run: |
          KEY=$(aws ssm get-parameter --name /wan-synthesizer/api-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          echo "WAN_SYNTHESIZER_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Install tools
        run: pip install pyyaml
      - name: Push the git-authored inputs to the API
        run: PYTHONPATH=lib/python:scripts python3 -c 'import seed; seed.main()'
  test-repo-libraries:
    name: test-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --upgrade boto3 highspy==1.15.1 pytest pytest-cov 'python-hcl2<8' pyyaml
      - name: Run the shared modules' unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/lib/python/repo_utils/pre_deployment/unit/
          test/lib/python/test_fixtures/pre_deployment/unit/
          test/lib/python/test_handler_contracts/pre_deployment/unit/
          test/lib/python/test_http_doubles/pre_deployment/unit/
          test/lib/python/test_module_utils/pre_deployment/unit/
          test/lib/python/test_published_syntheses/pre_deployment/unit/
          test/lib/python/test_s3_store_mock/pre_deployment/unit/
          test/lib/python/test_terraform_config/pre_deployment/unit/
          test/lib/python/test_terraform_drift/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/repo_utils
          --cov=lib/python/test_fixtures
          --cov=lib/python/test_handler_contracts
          --cov=lib/python/test_module_utils
          --cov=lib/python/test_published_syntheses
          --cov=lib/python/test_s3_store_mock
          --cov=lib/python/test_terraform_config
          --cov=lib/python/test_terraform_drift
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
      - name: Run the shared modules' integration tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts:src:test:src/api/endpoints/tenants/wan/post/lambdas
          python3 -m pytest
          test/lib/python/test_handler_contracts/pre_deployment/integration/
          test/lib/python/test_http_doubles/pre_deployment/
          test/lib/python/test_published_syntheses/pre_deployment/integration/
          test/lib/python/test_terraform_config/pre_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=lib/python/test_http_doubles
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  unit-tests:
    name: unit-tests
    needs: test-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pytest-cov pyyaml
      - name: Run unit tests with a 100% coverage gate
        run: >-
          PYTHONPATH=.:lib/python:scripts
          python3 -m pytest
          test/scripts/seed/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=seed
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  wait-for-every-deploy:
    if: github.ref == 'refs/heads/main'
    name: wait-for-every-deploy
    outputs:
      apply: ${{ steps.deploys.outputs.apply }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          POLL_LIMIT: '180'
          POLL_SECONDS: '20'
          WORKFLOWS: >-
            api_common_identity.yml
            api_common_routing.yml
            api_common_storage.yml
            api_endpoint_carriers.yml
            api_endpoint_carriers_merge.yml
            api_endpoint_providers.yml
            api_endpoint_tenants.yml
            api_endpoint_tenants_wan.yml
            api_endpoint_tenants_wan_post.yml
        id: deploys
        name: Wait for every deploy this commit started, so seeding runs against what it ships
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "No push started this run, so no deploy runs beside it."
            echo "apply=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FIELDS='.workflow_runs[] | "\(.status) \(.conclusion // "")"'
          APPLY=true
          for WORKFLOW in $WORKFLOWS; do
            RUNS="repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs"
            POLL=0
            while true; do
              RUN=$(gh api "$RUNS?head_sha=$GITHUB_SHA&per_page=1" --jq "$FIELDS")
              if [ -z "$RUN" ]; then
                echo "This commit started no $WORKFLOW run to wait for."
                break
              fi
              if [ "${RUN% *}" = completed ]; then
                CONCLUSION=${RUN#* }
                echo "$WORKFLOW on this commit ended $CONCLUSION."
                if [ "$CONCLUSION" != success ]; then
                  APPLY=false
                fi
                break
              fi
              if [ "$POLL" -ge "$POLL_LIMIT" ]; then
                echo "::error::$WORKFLOW on this commit has not finished."
                exit 1
              fi
              echo "$WORKFLOW on this commit is ${RUN% *}. Waiting."
              sleep "$POLL_SECONDS"
              POLL=$((POLL + 1))
            done
          done
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
  wait-for-every-wan:
    if: ${{ !cancelled() && needs.seeding.result == 'success' }}
    name: wait-for-every-wan
    needs: seeding
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.SEED_ROLE_ARN }}
      - name: Read the API key the authorizer admits
        run: |
          KEY=$(aws ssm get-parameter --name /wan-synthesizer/api-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          echo "WAN_SYNTHESIZER_API_KEY=$KEY" >> "$GITHUB_ENV"
      - env:
          API: https://api.10ulabs.com/wan-synthesizer
          POLL_LIMIT: '45'
          POLL_SECONDS: '20'
        name: Wait for every WAN the seed asked for, so e2e-tests grades what it built
        run: |
          for CONFIG in etc/*.yml; do
            TENANT=$(basename "$CONFIG" .yml | tr _ -)
            POLL=0
            while true; do
              STATUS=$(curl --silent \
                --header "Authorization: Bearer $WAN_SYNTHESIZER_API_KEY" \
                "$API/tenants/$TENANT/wan" | jq --raw-output '.status // .error // ""')
              case "$STATUS" in
                creating|synthesizing)
                  echo "$TENANT is $STATUS. Waiting."
                  ;;
                "")
                  echo "$TENANT gave no answer. Waiting."
                  ;;
                *)
                  echo "$TENANT ended $STATUS."
                  break
                  ;;
              esac
              if [ "$POLL" -ge "$POLL_LIMIT" ]; then
                echo "::error::$TENANT has not finished."
                exit 1
              fi
              sleep "$POLL_SECONDS"
              POLL=$((POLL + 1))
            done
          done
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install yamllint
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/seed.yml etc/daf.yml etc/dow.yml \
            etc/f_35.yml etc/minuteman.yml etc/two_pop.yml
name: seed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed.yml
      - data/**
      - etc/**
      - lib/python/**
      - scripts/seed.py
      - src/api/common/routing/authorizer.tf
      - src/api/common/storage/**
      - src/api/endpoints/tenants/wan/post/lambdas/**
      - src/www/api/openapi.json
      - test/lib/python/**
      - test/scripts/seed/**
  workflow_dispatch: {}
