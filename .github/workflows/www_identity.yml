---
concurrency:
  cancel-in-progress: true
  group: www-identity-${{ github.ref }}
env:
  AWS_USE_FIPS_ENDPOINT: "true"
jobs:
  assert-no-comments:
    name: assert-no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert nothing this repository publishes carries a comment
        uses: 10U-Labs/assert-no-comments@latest
        with:
          annotate: "true"
          exclude: src/www/spa/vendor/*
          trees: .github/workflows lib src test
          verbose: "true"
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no inline directives
        uses: 10U-Labs/assert-no-inline-directives@latest
        with:
          files: .github/workflows/www_identity.yml test/www/identity
          tools: pylint,mypy,yamllint
          verbose: "true"
  assert-no-pytest-plugin-declarations:
    name: assert-no-pytest-plugin-declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no pytest plugin declarations
        uses: 10U-Labs/assert-no-pytest-plugin-declarations@latest
        with:
          trees: test/www/identity
          verbose: "true"
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert one assert per pytest
        uses: 10U-Labs/assert-one-assert-per-pytest@latest
        with:
          files: test/www/identity
          verbose: "true"
  assert-opentofu-resource-is-used:
    name: assert-opentofu-resource-is-used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every OpenTofu resource is reached by something
        uses: 10U-Labs/assert-opentofu-resource-is-used@latest
        with:
          directories: src/www/identity lib/opentofu/common
          search-in: .
          verbose: "true"
  assert-pytest-class-holds-state:
    name: assert-pytest-class-holds-state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest class holds state
        uses: 10U-Labs/assert-pytest-class-holds-state@latest
        with:
          files: test/www/identity
          verbose: "true"
  assert-pytest-fixture-name-is-needed:
    name: assert-pytest-fixture-name-is-needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest fixture name is needed
        uses: 10U-Labs/assert-pytest-fixture-name-is-needed@latest
        with:
          trees: test/www/identity
          verbose: "true"
  assert-pytest-test-can-fail:
    name: assert-pytest-test-can-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest test can fail
        uses: 10U-Labs/assert-pytest-test-can-fail@latest
        with:
          files: test/www/identity
          verbose: "true"
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console test/www/identity/
  lint-yaml:
    name: lint-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: >-
            {extends: default, rules: {
            empty-lines: {max: 0, max-start: 0, max-end: 1},
            key-ordering: enable,
            line-length: disable,
            new-line-at-end-of-file: enable,
            truthy: {allowed-values: ["true", "false", "on"]}}}
          file_or_dir: .github/workflows/www_identity.yml
          strict: "true"
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python
          python3 -m mypy --strict --explicit-package-bases
          --ignore-missing-imports
          test/www/identity/
  post-deployment-integration-tests:
    if: github.ref == 'refs/heads/main'
    name: post-deployment-integration-tests
    needs:
      - reconciliation
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Install tools
        run: pip install --upgrade boto3 pytest
      - name: Read the API key under the role the stack reconciled
        run: >-
          PYTHONPATH=.:lib/python
          python3 -m pytest
          test/www/identity/post_deployment/integration/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint boto3 pytest pyyaml 'python-hcl2<8'
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python
          python3 -m pylint --recursive=y
          test/www/identity/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  reconciliation:
    name: reconciliation
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-no-pytest-plugin-declarations
      - assert-one-assert-per-pytest
      - assert-opentofu-resource-is-used
      - assert-pytest-class-holds-state
      - assert-pytest-fixture-name-is-needed
      - assert-pytest-test-can-fail
      - copy-paste-tests
      - lint-yaml
      - mypy-tests
      - pylint-tests
      - unit-tests
      - validate-stack
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Reconcile the stack to its declared state
        run: |
          tofu -chdir=src/www/identity init -input=false
          tofu -chdir=src/www/identity apply -auto-approve -input=false
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest 'python-hcl2<8' pyyaml
      - name: Hold the declaration to the grants the workflows need
        run: >-
          PYTHONPATH=.:lib/python
          python3 -m pytest
          test/www/identity/pre_deployment/unit/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
  validate-stack:
    name: validate-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Validate the stack
        run: |
          tofu -chdir=src/www/identity init -backend=false -input=false
          tofu -chdir=src/www/identity validate
name: www_identity
'on':
  push:
    branches: [main]
    paths:
      - src/www/identity/**
      - test/www/identity/**
      - .github/workflows/www_identity.yml
  workflow_dispatch: {}
permissions:
  contents: read
