---
concurrency:
  cancel-in-progress: false
  group: etl-syntheses
env:
  AWS_USE_FIPS_ENDPOINT: "true"
jobs:
  assert-no-comments:
    name: assert-no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert nothing this repository publishes carries a comment
        uses: 10U-Labs/assert-no-comments@latest
        with:
          annotate: "true"
          exclude: src/www/spa/vendor/*
          trees: .github/workflows lib src test
          verbose: "true"
  assert-no-inline-directives:
    name: assert-no-inline-directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no inline directives
        uses: 10U-Labs/assert-no-inline-directives@latest
        with:
          files: .github/workflows/etl_syntheses.yml src/etl/syntheses test/etl/syntheses
          tools: pylint,mypy,yamllint
          verbose: "true"
  assert-no-pytest-plugin-declarations:
    name: assert-no-pytest-plugin-declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no pytest plugin declarations
        uses: 10U-Labs/assert-no-pytest-plugin-declarations@latest
        with:
          trees: test/etl/syntheses
          verbose: "true"
  assert-one-assert-per-pytest:
    name: assert-one-assert-per-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert one assert per pytest
        uses: 10U-Labs/assert-one-assert-per-pytest@latest
        with:
          files: test/etl/syntheses
          verbose: "true"
  assert-pytest-class-holds-state:
    name: assert-pytest-class-holds-state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest class holds state
        uses: 10U-Labs/assert-pytest-class-holds-state@latest
        with:
          files: test/etl/syntheses
          verbose: "true"
  assert-pytest-fixture-name-is-needed:
    name: assert-pytest-fixture-name-is-needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest fixture name is needed
        uses: 10U-Labs/assert-pytest-fixture-name-is-needed@latest
        with:
          trees: test/etl/syntheses
          verbose: "true"
  assert-pytest-test-can-fail:
    name: assert-pytest-test-can-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert every pytest test can fail
        uses: 10U-Labs/assert-pytest-test-can-fail@latest
        with:
          files: test/etl/syntheses
          verbose: "true"
  copy-paste-source:
    name: copy-paste-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console src/ lib/
  copy-paste-tests:
    name: copy-paste-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console test/ lib/
  load:
    if: github.ref == 'refs/heads/main'
    name: load
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-no-pytest-plugin-declarations
      - assert-one-assert-per-pytest
      - assert-pytest-class-holds-state
      - assert-pytest-fixture-name-is-needed
      - assert-pytest-test-can-fail
      - copy-paste-source
      - copy-paste-tests
      - mypy-source
      - mypy-tests
      - pre-deployment-tests
      - pylint-source
      - pylint-tests
      - yamllint
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Install tools
        run: pip install pyyaml
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Wait for the regions load on this commit, if one is running
        run: |
          RUNS="repos/$GITHUB_REPOSITORY/actions/workflows/etl_regions.yml/runs"
          for ATTEMPT in $(seq 1 60); do
            RUNNING=$(gh api "$RUNS?head_sha=$GITHUB_SHA&per_page=10" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$RUNNING" = "0" ]; then
              echo "No regions load is running on $GITHUB_SHA."
              exit 0
            fi
            echo "A regions load is running on $GITHUB_SHA; waiting ($ATTEMPT)."
            sleep 30
          done
          echo "The regions load on $GITHUB_SHA has not finished in thirty minutes."
          exit 1
      - env:
          ALL: ${{ inputs.all }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        name: Create a synthesis for every run whose configuration changed since the last load
        run: |
          RUNS="repos/$GITHUB_REPOSITORY/actions/workflows/etl_syntheses.yml/runs"
          SINCE=$(gh api "$RUNS?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$SINCE" ]; then
            SINCE=$BEFORE
          fi
          if [ "$ALL" = "true" ]; then
            SINCE=""
            echo "Creating a synthesis for every run."
          else
            echo "Creating a synthesis for every run whose configuration changed since $SINCE."
          fi
          KEY=$(aws ssm get-parameter --name /api.10ulabs.com/api-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          API_KEY="$KEY" PYTHONPATH=src:lib/python python3 -c \
            'import sys; from etl.syntheses import load_syntheses; sys.exit(load_syntheses.main(sys.argv[1:]))' \
            --since "$SINCE"
  mypy-source:
    name: mypy-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pyyaml types-PyYAML
      - name: Run mypy on source
        run: >-
          MYPYPATH=lib/python:src
          python3 -m mypy --strict --explicit-package-bases
          --ignore-missing-imports
          src/ lib/
  mypy-tests:
    name: mypy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install mypy pytest pyyaml 'python-hcl2<8' types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=lib/python:src
          python3 -m mypy --strict --explicit-package-bases
          --ignore-missing-imports
          test/ lib/
  post-deployment-e2e-tests:
    if: github.ref == 'refs/heads/main'
    name: post-deployment-e2e-tests
    needs:
      - load
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Install tools
        run: pip install pytest pyyaml
      - name: Read the syntheses back and hold them to their configurations
        run: |
          KEY=$(aws ssm get-parameter --name /api.10ulabs.com/api-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          API_KEY="$KEY" PYTHONPATH=.:lib/python:src python3 -m pytest \
            test/etl/syntheses/post_deployment/e2e/ \
            --import-mode=importlib --confcutdir=test \
            --verbose --pythonwarnings=error
  pre-deployment-tests:
    name: pre-deployment-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pytest pytest-cov pyyaml
      - name: Run the unit and integration tiers with a full coverage gate
        run: >-
          PYTHONPATH=.:lib/python:src
          python3 -m pytest
          test/etl/syntheses/pre_deployment/
          --import-mode=importlib --confcutdir=test
          --verbose --pythonwarnings=error
          --cov=src/etl/syntheses
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
  pylint-source:
    name: pylint-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint pyyaml
      - name: Run pylint on source
        run: >-
          PYTHONPATH=lib/python:src
          python3 -m pylint --recursive=y
          src/ lib/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    name: pylint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install pylint pytest pyyaml 'python-hcl2<8' boto3
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:lib/python:src
          python3 -m pylint --recursive=y
          test/ lib/
          --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring
          --fail-on=C,R,W --fail-under=10.0
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: >-
            {extends: default, rules: {
            empty-lines: {max: 0, max-start: 0, max-end: 1},
            key-ordering: enable,
            line-length: disable,
            new-line-at-end-of-file: enable,
            truthy: {allowed-values: ["true", "false", "on"]}}}
          file_or_dir: .github/workflows/etl_syntheses.yml
          strict: "true"
name: etl_syntheses
'on':
  push:
    branches: [main]
    paths:
      - etc/**
      - data/tenants/**
      - src/etl/syntheses/**
      - test/etl/syntheses/**
      - test/conftest.py
      - lib/python/**
      - .github/workflows/etl_syntheses.yml
  workflow_dispatch:
    inputs:
      all:
        default: false
        description: Create a synthesis for every run, changed or not.
        required: false
        type: boolean
permissions:
  contents: read
